[package]
name = "rust-service-monitor"
version = "0.1.0"
edition = "2021"
description = "Concurrent HTTP endpoint checks with timeouts and JSON reports"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
